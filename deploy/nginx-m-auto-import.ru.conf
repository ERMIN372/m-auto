# M-AUTO: конфиг nginx для своего сервера (VPS) с PHP-FPM.
# Куда: /etc/nginx/sites-available/m-auto-import.ru.conf + симлинк в sites-enabled.
# Файлы сайта (содержимое dist/): /var/www/m-auto-import.ru
# Заявки: storage_dir в api/config.php = '/var/lib/m-auto/storage' (вне сайта).
# Сокет PHP-FPM проверить: ls /run/php/  (php8.2-fpm.sock, php8.3-fpm.sock и т.п.)
# Сертификат выпускается certbot: certbot --nginx -d m-auto-import.ru -d www.m-auto-import.ru
# certbot сам допишет блок listen 443 и редирект на https.

server {
    listen 80;
    listen [::]:80;
    server_name www.m-auto-import.ru;
    return 301 http://m-auto-import.ru$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name m-auto-import.ru;

    root /var/www/m-auto-import.ru;
    index index.html;
    charset utf-8;

    error_page 404 /404.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # служебное закрыто: заявки, конфиг с токеном, скрытые файлы
    location ^~ /api/storage/ { deny all; return 404; }
    location = /api/config.php { deny all; return 404; }
    location = /api/config.example.php { deny all; return 404; }
    location ~ /\. { deny all; return 404; }

    # единственный исполняемый PHP
    location = /api/send.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        client_max_body_size 64k;
    }
    location ~ \.php$ { return 404; }

    # CSS, JS, шрифты и картинки подключаются с ?v=хэш
    location ~* \.(?:css|js|woff2|webp|jpg|jpeg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location ~* \.(?:png|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
