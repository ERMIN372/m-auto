<head>

<!-- env:prod --><base href="{{site_url}}/"><!-- endenv:prod -->
<!-- include:assets -->
<title>Страница не найдена | M-AUTO</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<!-- include:header -->
<main id="main" class="doc">

  <div class="doc__inner thanks">
    <h1 class="doc__title">Такой страницы нет</h1>
    <p class="thanks__text">Возможно, ссылка устарела или в адресе опечатка.</p>
    <div class="thanks__actions">
      <a class="btn btn--primary" href="./#form">Получить варианты</a>
      <a class="thanks__home" href="./">На главную</a>
    </div>
  </div>
  </div>
</main>

</html>
